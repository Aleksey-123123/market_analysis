# Конфиг выгрузки открытых данных ЕИС.
# Пути ЕИС меняются со временем — проверьте актуальную структуру на FTP
# ftp://ftp.zakupki.gov.ru/ (логин free / пароль free) перед запуском.
# Ниже — примерные каталоги; подставьте нужные регионы/периоды.

ftp_timeout: 60
date_from: "2024-07-01"        # отсекать записи старше этой даты

sources:
  # 44-ФЗ: извещения по региону (пример каталога)
  - fz: "44"
    remote_dir: "/fcs_regions/Novosibirskaja_obl/notifications/currMonth"
    max_archives: 30           # ограничение на 1 запуск (архивы тяжёлые)

  # 223-ФЗ: публикации (пример; уточните актуальный путь в каталоге /out или /223fz)
  - fz: "223"
    remote_dir: "/out/published/currMonth"
    max_archives: 30

# Фильтры ниш применяются на этапе analyze.py (--group / --min-lots).
# Целевые ОКПД2-гипотезы (для справки, чтобы отфильтровать после парсинга):
target_okpd2:
  - "24.10"   # прокат/заготовки чёрных металлов, спецсталь
  - "24.45"   # прочие цветные металлы (титан и сплавы)
  - "28.92"   # машины для добычи и карьеров, ЗИП
  - "20.59"   # промышленная химия, реагенты
  - "25.94"   # крепёж, метизы
  - "43.99"   # спецработы, ремонт ИССО
